<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Mastery Diagnostic{% endblock %} | Quick2Labs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cream: '#F5F0EB',
                        navy: '#0F172A',
                        blue: '#3B5BDB',
                        gold: '#D97706',
                        'navy-light': '#1E293B',
                        'navy-mid': '#334155',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request.htmx-indicator { display: inline-block; }
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0F172A; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        /* Markdown content styling */
        .prose h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: #F5F0EB; }
        .prose h2 { font-size: 1.25rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem; color: #D97706; }
        .prose h3 { font-size: 1.1rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.25rem; color: #F5F0EB; }
        .prose p { margin-bottom: 0.5rem; color: #CBD5E1; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.5rem; color: #CBD5E1; }
        .prose ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.5rem; color: #CBD5E1; }
        .prose li { margin-bottom: 0.25rem; }
        .prose strong { color: #F5F0EB; }
        .prose code { background: #1E293B; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875rem; color: #3B5BDB; }
        .prose pre { background: #1E293B; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 0.75rem; }
        .prose pre code { background: none; padding: 0; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pulse-gold { animation: pulseGold 2s infinite; }
        @keyframes pulseGold { 0%, 100% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.4); } 50% { box-shadow: 0 0 0 8px rgba(217, 119, 6, 0); } }
    </style>
</head>
<body class="bg-navy text-cream min-h-screen">
    <!-- Nav -->
    <nav class="border-b border-navy-mid bg-navy/95 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 text-cream hover:text-gold transition-colors">
                <svg class="w-7 h-7 text-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                </svg>
                <span class="font-bold text-lg">AI Mastery</span>
                <span class="text-xs text-navy-mid font-mono ml-1">by Quick2Labs</span>
            </a>
            <div class="flex items-center gap-4 text-sm">
                <a href="/" class="text-cream/70 hover:text-gold transition-colors">Dashboard</a>
                <a href="/quiz/start" class="text-cream/70 hover:text-gold transition-colors">Diagnostic</a>
                <a href="/curriculum" class="text-cream/70 hover:text-gold transition-colors">Curriculum</a>
            </div>
        </div>
    </nav>

    <!-- Main -->
    <main class="max-w-5xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-navy-mid mt-12 py-6 text-center text-sm text-navy-mid">
        Quick2Labs &mdash; AI Mastery Diagnostic Engine
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
